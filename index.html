<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VÉDÉ Terrain</title>
<meta name="theme-color" content="#0F5C63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VÉDÉ Terrain">
<script>window.VEDE_PWA = true;</script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#E8EDF0;--surface:#FFFFFF;--surface-2:#F3F6F8;--ink:#12202A;--ink-2:#33434E;--muted:#5C6C78;--line:#C7D1D8;--line-2:#DEE5EA;
  --brand:#0F5C63;--brand-soft:#D9ECEB;--on-brand:#FFFFFF;
  --eu:#B13A11;--eu-soft:#FBE5DB;--eu-ink:#7A2606;--on-eu:#FFFFFF;
  --ep:#1D54C4;--ep-soft:#E0E9FB;--ep-ink:#133B8C;--on-ep:#FFFFFF;
  --warn:#8A5300;--warn-soft:#FFF0D1;--warn-line:#EBC27A;
  --ok:#21704A;--ok-soft:#DBF0E4;
  --danger:#B42318;
  --scrim:rgba(9,18,24,.5);
  --shadow:0 18px 50px -22px rgba(9,18,24,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D161C;--surface:#152029;--surface-2:#1B2832;--ink:#E4ECF1;--ink-2:#C2CFD8;--muted:#92A4B1;--line:#2C3C48;--line-2:#22313B;
    --brand:#0F5C63;--brand-soft:#12383C;--on-brand:#FFFFFF;
    --eu:#EE7748;--eu-soft:#3B1D12;--eu-ink:#FFB08E;--on-eu:#1B0A03;
    --ep:#6E9AFF;--ep-soft:#162649;--ep-ink:#B3C9FF;--on-ep:#06142F;
    --warn:#F0AE48;--warn-soft:#38290D;--warn-line:#6B4E17;
    --ok:#5BC98D;--ok-soft:#113222;--danger:#FF8A7A;--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161C;--surface:#152029;--surface-2:#1B2832;--ink:#E4ECF1;--ink-2:#C2CFD8;--muted:#92A4B1;--line:#2C3C48;--line-2:#22313B;
  --brand:#0F5C63;--brand-soft:#12383C;--on-brand:#FFFFFF;
  --eu:#EE7748;--eu-soft:#3B1D12;--eu-ink:#FFB08E;--on-eu:#1B0A03;
  --ep:#6E9AFF;--ep-soft:#162649;--ep-ink:#B3C9FF;--on-ep:#06142F;
  --warn:#F0AE48;--warn-soft:#38290D;--warn-line:#6B4E17;
  --ok:#5BC98D;--ok-soft:#113222;--danger:#FF8A7A;--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ep);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:4px;min-height:58px;padding:5px 8px;background:var(--brand);color:var(--on-brand)}
.bar-t{flex:1 1 auto;min-width:0;padding:0 6px}
.bar-title{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-weight:700;font-size:23px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-pad{width:6px}
.bar-logo{flex:0 0 auto;width:38px;height:38px;margin:0 2px 0 4px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
@media (max-width:600px){.bar .iconbtn[data-act="back"] ~ .bar-logo{display:none}}
.home-logo{display:inline-block;margin:0 0 18px;padding:12px 18px;background:#fff;border:1px solid var(--line-2);border-radius:14px}
.home-logo img{display:block;width:280px;max-width:100%;height:auto}
.iconbtn{flex:0 0 auto;display:inline-grid;place-items:center;width:48px;height:48px;border:0;border-radius:12px;background:transparent;color:inherit;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.16)}
.net-off{flex:0 0 auto;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#FFF0D1;color:#6B4100}
.main{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.split{flex:1 1 auto;min-height:0;display:flex}
.pane{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pane.list{flex:0 0 400px;max-width:42%;background:var(--surface);border-right:1px solid var(--line)}
.pane.detail{flex:1 1 auto;min-width:0}
.page{padding:20px 16px 40px;max-width:900px;margin:0 auto}
.page.narrow{max-width:760px}
.page.ed{padding-bottom:0}
.h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:34px;line-height:1.05;margin:4px 0 10px}
.h2{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:25px;line-height:1.1;margin:0}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{color:var(--muted);font-size:15px;margin:20px 0 0;max-width:68ch}
.gap{height:14px}
.mt{margin-top:18px}
.btn{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;line-height:1.15;cursor:pointer;text-decoration:none;text-align:center}
.btn svg{flex:0 0 auto}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.eu{background:var(--eu);border-color:var(--eu);color:var(--on-eu)}
.btn.ep{background:var(--ep);border-color:var(--ep);color:var(--on-ep)}
.btn.big{min-height:56px;font-size:18px;padding:12px 18px}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:6px 10px;font-size:15px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.elist{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ename{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1.1}
.etal{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;align-items:flex-start}
.emeta{grid-column:1;color:var(--ink-2)}
.erow .prog{grid-column:1 / -1}
.eexp{grid-column:1 / -1;font-size:14px;color:var(--muted)}
.eexp.dirty{color:var(--warn);font-weight:600}
.empty{margin:26px 0;padding:22px;border:2px dashed var(--line);border-radius:16px;color:var(--ink-2);max-width:62ch}
.empty p{margin:0 0 6px}
.tally{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;line-height:1;padding:5px 8px;border-radius:999px;white-space:nowrap}
.tally.eu{background:var(--eu-soft);color:var(--eu-ink)}
.tally.ep{background:var(--ep-soft);color:var(--ep-ink)}
.st{display:inline-block;font-size:13px;font-weight:600;line-height:1;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.st.visitee{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st.a_revoir{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st.absent,.st.refus{color:var(--ink-2)}
.prog{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line-2);margin:8px 0}
.prog i{display:block;height:100%}
.prog .p-ok{background:var(--ok)}.prog .p-warn{background:var(--warn)}.prog .p-oth{background:var(--muted)}
.lp-head{position:sticky;top:0;z-index:2;background:var(--surface);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:15px}
.stats strong{font-family:"Barlow Condensed",sans-serif;font-size:23px}
.st-warn{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-weight:600}
.exp-state{font-size:13px;color:var(--muted);margin:0 0 8px}
.exp-state.dirty{color:var(--warn);font-weight:600}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface-2);color:var(--muted)}
.searchbox input[type=search]{flex:1;min-width:0;min-height:46px;border:0;padding:0;background:transparent;color:var(--ink);outline:none;font-size:17px}
.searchbox:focus-within{outline:3px solid var(--ep);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:0 0 auto;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .cnt{opacity:.7;font-weight:500}
.vlist{list-style:none;margin:0;padding:0}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;color:inherit;min-height:66px}
.vrow:active{background:var(--surface-2)}
.vrow.active{background:var(--brand-soft);box-shadow:inset 4px 0 0 var(--brand)}
.vnum{grid-row:1 / span 2;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1;min-width:2.6ch;font-variant-numeric:tabular-nums}
.vmain{min-width:0;display:flex;flex-direction:column}
.vaddr{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px}
.flag{display:inline-flex;color:var(--warn)}
.empty-li{padding:24px 16px;color:var(--muted)}
.pick-hint{margin:12vh auto 0;max-width:40ch;text-align:center}
.vhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.vtitle{display:flex;gap:14px;align-items:flex-start;min-width:0}
.bignum{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:46px;line-height:.92;font-variant-numeric:tabular-nums}
.vaddr-l{font-size:21px;font-weight:600;line-height:1.2}
.vsub-l{color:var(--muted)}
.pn{display:flex;gap:6px;flex:0 0 auto}
.contact{margin:0 0 12px;font-weight:600}
.contact a{color:var(--ep)}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:14px 14px 2px;margin:0 0 14px}
.lbl{display:block;font-weight:600;font-size:15px;color:var(--ink-2);margin:0 0 8px}
.req,.opt{font-weight:500;color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.seg button{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:block;margin:0 0 14px}
input[type=text],input[type=date],select,textarea{width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:17px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
.check{display:flex;align-items:center;gap:12px;min-height:48px;margin:4px 0 10px;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--brand)}
.check.big{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.sec{margin:22px 0}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.issues{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.issues .it{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--warn)}
.issues ul{margin:6px 0 0;padding-left:20px}
.issues li{margin:3px 0}
.okline{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;margin:0 0 14px}
.inline-warn{background:var(--warn-soft);border-radius:10px;padding:8px 12px;color:var(--warn);font-weight:600;margin:0 0 14px}
.alist{display:flex;flex-direction:column;gap:10px}
.anom{display:block;position:relative;padding:12px 14px 12px 24px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;text-decoration:none;color:inherit;overflow:hidden}
.anom::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--eu)}
.anom.ep::before{background:var(--ep)}
.anom-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.anum{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1}
.net-tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;line-height:1;padding:4px 8px;border-radius:6px;background:var(--eu);color:var(--on-eu)}
.net-tag.ep{background:var(--ep);color:var(--on-ep)}
.aloc{color:var(--muted);font-size:15px}
.aph{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:14px}
.aobs{font-weight:600}
.apre{color:var(--ink-2);margin-top:2px}
.lbl-in{color:var(--muted);font-weight:600}
.amiss{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--warn);font-weight:600;font-size:14px}
.ed-head{margin:0 0 14px}
.ed-head p{margin:2px 0 0}
.net{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.net button{min-height:66px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;cursor:pointer;color:var(--ink-2)}
.net button.eu[aria-pressed="true"]{background:var(--eu);border-color:var(--eu);color:var(--on-eu)}
.net button.ep[aria-pressed="true"]{background:var(--ep);border-color:var(--ep);color:var(--on-ep)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:0 0 10px}
.ph{position:relative;display:block;aspect-ratio:1/1;padding:0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.saved-note{font-size:14px;color:var(--muted);margin:8px 0 4px}
.sticky-actions{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 16px;margin:12px -16px 0;background:var(--surface);border-top:1px solid var(--line)}
.sticky-actions .sp{flex:1}
details.xls{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:2px 14px}
details.xls summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.xls dl{display:grid;grid-template-columns:minmax(110px,36%) 1fr;gap:6px 14px;margin:4px 0 12px}
details.xls dt{color:var(--muted);font-size:15px}
details.xls dd{margin:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}.addrow{grid-template-columns:1fr 1fr}}
.summary{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:12px;margin:0 0 14px;background:var(--surface)}
table.prev{border-collapse:collapse;width:100%;font-size:15px}
table.prev th,table.prev td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.prev th{background:var(--surface-2);font-weight:600}
.bgroup{margin:22px 0}
.bgroup .h2{margin-bottom:10px}
.bitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:12px 12px 12px 24px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);position:relative;overflow:hidden;margin:0 0 8px}
.bitem::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--eu)}
.bitem.ep::before{background:var(--ep)}
.bo{font-weight:600}
.bp{color:var(--ink-2)}
.bx{display:flex;gap:4px}
.badge-ex{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.fiche-wrap{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:10px;overflow:auto}
.modal-back{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--scrim)}
@media (min-width:700px){.modal-back{align-items:center}}
.modal{width:min(580px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.m-title{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;line-height:1.15;margin:0;padding:18px 18px 6px}
.m-body{padding:4px 18px 14px;overflow:auto}
.m-body p{margin:0 0 8px}
.m-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--line-2)}
.sheet-list{display:flex;flex-direction:column;gap:8px}
.sheet-list .btn{justify-content:flex-start;text-align:left;width:100%}
.pick-item{display:block;width:100%;text-align:left;padding:12px 14px 12px 22px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);cursor:pointer;position:relative;overflow:hidden}
.pick-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--eu)}
.pick-item.ep::before{background:var(--ep)}
.pick-item .po{font-weight:600}
.pick-item .pp{color:var(--muted);font-size:15px}
.photo-full{display:block;max-width:100%;max-height:62vh;margin:0 auto;border-radius:12px}
.busy-bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;margin:12px 0 6px}
.busy-bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,16px);opacity:0;max-width:calc(100% - 24px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:600;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fatal{padding:30px 20px;max-width:640px;margin:0 auto}
.datebox{position:relative;display:flex;align-items:center;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px;font-weight:600}
.datebox:focus-within{outline:3px solid var(--ep);outline-offset:1px}
.datebox .date-native{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
.datebox .date-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.daterow{display:flex;gap:8px;align-items:stretch}.daterow .datebox{flex:1}.date-empty{color:var(--muted);font-weight:500}
.contact-l{margin:0 0 12px;line-height:1.6}.contact-l a{color:var(--ep);font-weight:600}
.opt-list{display:flex;flex-direction:column;gap:4px;margin:0 0 14px}.radio{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}.radio input{width:22px;height:22px;accent-color:var(--brand)}
.pick-chips{flex-wrap:wrap;overflow:visible;padding:12px 0 6px}.pick-chips .chip{min-height:42px;font-size:15px}
.pick-cat{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:19px;color:var(--ink-2);margin:16px 0 8px}.pick-cat:first-child{margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:active{transform:none}}
</style>

/* ---------- Stockage local (IndexedDB) ---------- */
var DB = {
  db: null,
  open: function(){
    var self = this;
    return new Promise(function(resolve, reject){
      var req;
      try { req = indexedDB.open('vede-terrain', 1); } catch(e){ reject(e); return; }
      req.onupgradeneeded = function(){
        var db = req.result, s;
        if (!db.objectStoreNames.contains('etudes')) db.createObjectStore('etudes', {keyPath: 'id'});
        if (!db.objectStoreNames.contains('visites')){ s = db.createObjectStore('visites', {keyPath: 'id'}); s.createIndex('etudeId', 'etudeId'); }
        if (!db.objectStoreNames.contains('anomalies')){ s = db.createObjectStore('anomalies', {keyPath: 'id'}); s.createIndex('etudeId', 'etudeId'); s.createIndex('visiteId', 'visiteId'); }
        if (!db.objectStoreNames.contains('photos')){ s = db.createObjectStore('photos', {keyPath: 'id'}); s.createIndex('anomalieId', 'anomalieId'); s.createIndex('etudeId', 'etudeId'); }
        if (!db.objectStoreNames.contains('biblio')) db.createObjectStore('biblio', {keyPath: 'id'});
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath: 'k'});
      };
      req.onsuccess = function(){ self.db = req.result; resolve(self.db); };
      req.onerror = function(){ reject(req.error || new Error('Ouverture du stockage impossible')); };
      req.onblocked = function(){ reject(new Error("Stockage bloqué par un autre onglet de l'application")); };
    });
  },
  _run: function(store, mode, fn){
    var self = this;
    return new Promise(function(resolve, reject){
      var tx = self.db.transaction(store, mode), result;
      var r = fn(tx.objectStore(store));
      if (r) r.onsuccess = function(){ result = r.result; };
      tx.oncomplete = function(){ resolve(result); };
      tx.onerror = function(){ reject(tx.error); };
      tx.onabort = function(){ reject(tx.error || new Error('Écriture annulée')); };
    });
  },
  get: function(st, k){ return this._run(st, 'readonly', function(s){ return s.get(k); }); },
  put: function(st, v){ return this._run(st, 'readwrite', function(s){ return s.put(v); }); },
  del: function(st, k){ return this._run(st, 'readwrite', function(s){ return s.delete(k); }); },
  all: function(st){ return this._run(st, 'readonly', function(s){ return s.getAll(); }); },
  byIndex: function(st, ix, v){ return this._run(st, 'readonly', function(s){ return s.index(ix).getAll(v); }); },
  keysByIndex: function(st, ix, v){ return this._run(st, 'readonly', function(s){ return s.index(ix).getAllKeys(v); }); },
  putMany: function(st, vals){ return this._run(st, 'readwrite', function(s){ vals.forEach(function(v){ s.put(v); }); return null; }); },
  delMany: function(st, keys){ return this._run(st, 'readwrite', function(s){ keys.forEach(function(k){ s.delete(k); }); return null; }); }
};

/* Enregistrement différé : chaque frappe est conservée, écrite par lots courts */

function flushSaves(){
  clearTimeout(pendingTimer);

}

/* ---------- Complétude : ce qui manque est toujours signalé ---------- */
function issuesOf(v, list){
  var out = [];
  if (list.length && v.statut === 'a_visiter') out.push({msg: 'Des anomalies sont saisies mais le statut est encore « À visiter ».'});
  if (v.statut === 'visitee'){
    if (!list.length && !v.aucuneAnomalie) out.push({msg: 'Ajoutez une anomalie ou cochez « Aucune anomalie constatée ».'});
    if (!v.dateVisite) out.push({msg: 'Date de visite manquante.'});
  }
  list.forEach(function(a, i){
    var n = 'A' + (i + 1);
    if (a.brouillon) out.push({aid: a.id, msg: n + ' : anomalie non validée.'});
    if (a.reseau !== 'EU' && a.reseau !== 'EP') out.push({aid: a.id, msg: n + ' : réseau EU ou EP non précisé.'});
    if (!lignesSansPuce(a.observation).length) out.push({aid: a.id, msg: n + ' : anomalie observée non décrite.'});
    if (!precoLines(a.preconisation).length) out.push({aid: a.id, msg: n + ' : préconisation manquante.'});
    if (!(a.photos || []).length && !a.photoNonRequise) out.push({aid: a.id, msg: n + ' : aucune photo.'});
  });
  return out;
}
function etudeStats(vs, as){
  var by = groupBy(as, 'visiteId');
  var st = {total: vs.length, visited: 0, visitedOk: 0, visitedWarn: 0, others: 0, incomplete: 0, eu: 0, ep: 0, avec: 0};
  vs.forEach(function(v){
    var l = (by.get(v.id) || []).slice().sort(byCreated), n = issuesOf(v, l).length;
    if (n) st.incomplete++;
    if (l.length) st.avec++;
    if (v.statut === 'visitee'){ st.visited++; if (n) st.visitedWarn++; else st.visitedOk++; }
    else if (v.statut === 'a_revoir' || v.statut === 'absent' || v.statut === 'refus') st.others++;
  });
  as.forEach(function(a){ if (a.reseau === 'EU') st.eu++; else if (a.reseau === 'EP') st.ep++; });
  return st;
}

/* ---------- Navigation ---------- */
function parseRoute(){
  var p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(function(x){ try { return decodeURIComponent(x); } catch(e){ return x; } });
  if (p[0] === 'import') return {name: 'import'};
  if (p[0] === 'bibliotheque') return {name: 'biblio'};
  if (p[0] === 'e' && p[1]){
    var r = {eid: p[1]};
    if (p[2] === 'maj'){ r.name = 'update'; return r; }
    if (p[2] === 'v' && p[3]){
      r.vid = p[3];
      if (p[4] === 'a' && p[5]){ r.name = 'anom'; r.aid = p[5]; return r; }
      if (p[4] === 'fiche'){ r.name = 'fiche'; return r; }
      r.name = 'visit'; return r;
    }
    r.name = 'etude'; return r;
  }
  return {name: 'home'};
}
function go(h){ if (location.hash === h) render(); else location.hash = h; }
function mqWide(){ try { return window.matchMedia('(min-width: 960px)').matches; } catch(e){ return false; } }

  var a = null; for (var i = 0; i < S.anoms.length; i++) if (S.anoms[i].id === aid) a = S.anoms[i];

  var empty = !String(a.observation || '').trim() && !String(a.preconisation || '').trim() && !String(a.localisation || '').trim() && !(a.photos || []).length;
  if (empty){ pending.delete('anomalies:' + a.id); await DB.del('anomalies', a.id); S.anoms = S.anoms.filter(function(x){ return x.id !== a.id; }); }
}

var renderSeq = 0;
async function render(){
  var seq = ++renderSeq;
  try {
    await flushSaves();
    var route = parseRoute(), prev = S.route;
    if (prev && prev.name === 'anom' && !(route.name === 'anom' && route.aid === prev.aid)) await cleanupDraft(prev.aid);
    var sameHash = (location.hash || '#/') === S.curHash;
    if (!sameHash){ S.lastHash = S.curHash; S.curHash = location.hash || '#/'; }
    S.route = route;
    if (route.eid && (!S.etude || S.etude.id !== route.eid)){
      if (!(await loadEtude(route.eid))){ toast('Étude introuvable sur cet appareil.'); S.route = {name: 'home'}; location.replace('#/'); return; }
    }
    if ((route.name === 'visit' || route.name === 'anom' || route.name === 'fiche') && !curVisit()){ location.replace('#/e/' + route.eid); return; }
    if (route.name === 'anom' && !curAnom()){ location.replace('#/e/' + route.eid + '/v/' + route.vid); return; }
    if (seq !== renderSeq) return;
    S.wide = mqWide();
    var lp = $('#lp'), lpScroll = lp ? lp.scrollTop : null;
    var dp = $('#dp') || $('#main'), dpScroll = (sameHash && dp) ? dp.scrollTop : null;
    revokeUrls();
    var out = await buildView(route);
    if (seq !== renderSeq) return;
    $('#app').innerHTML = out.bar + (out.split ? out.body : '<main class="main" id="main">' + out.body + '</main>');
    if (out.split){
      var nlp = $('#lp');
      if (nlp && lpScroll !== null && S.lpEtude === S.etude.id) nlp.scrollTop = lpScroll;
      else { var act = $('#lp .vrow.active'); if (act && act.scrollIntoView) act.scrollIntoView({block: 'center'}); }
      S.lpEtude = S.etude.id;
    } else S.lpEtude = null;
    if (dpScroll !== null){ var ndp = $('#dp') || $('#main'); if (ndp) ndp.scrollTop = dpScroll; }
    if (out.after) await out.after();
    updateNet();
  } catch(e){ reportError(e, 'Affichage'); }
}

async function compressImage(file){
  var MAX = 1600, Q = 0.82;
  try {
    var url = URL.createObjectURL(file);
    try {
      var img = new Image(), TO = window.__VT_IMG_TIMEOUT || 12000;
      var loaded = new Promise(function(res, rej){ img.onload = res; img.onerror = function(){ rej(new Error('format non lisible')); }; });
      img.src = url;
      await Promise.race([img.decode ? img.decode() : loaded, new Promise(function(res, rej){ setTimeout(function(){ rej(new Error('délai dépassé')); }, TO); })]);
      var w0 = img.naturalWidth, h0 = img.naturalHeight; if (!w0 || !h0) throw new Error('image vide');
      var s = Math.min(1, MAX / Math.max(w0, h0)), w = Math.round(w0 * s), h = Math.round(h0 * s);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var ctx = c.getContext('2d'); if (!ctx) throw new Error('canvas');
      ctx.drawImage(img, 0, 0, w, h);
      var blob = await new Promise(function(res){ c.toBlob(res, 'image/jpeg', Q); });
      if (!blob) throw new Error('compression');
      return {data: await blobToAB(blob), type: 'image/jpeg', w: w, h: h};
    } finally { URL.revokeObjectURL(url); }
  } catch(e){
    return {data: await blobToAB(file), type: file.type || 'image/jpeg', w: 0, h: 0};
  }
}

  var vHead = ['N° dossier', 'Adresse de la visite', 'Commune', 'Propriétaire', 'Téléphone', 'Mail', 'Adresse du domicile', 'Statut', 'Date de visite', 'Anomalies', 'dont EU', 'dont EP', 'Aucune anomalie constatée', 'Points à compléter', 'Observation EP', 'Observation EU', 'Notes internes'].concat(extra.map(function(h){ return 'Tableau : ' + h; }));
  var vRows = vs.map(function(v){
    var l = (by.get(v.id) || []).slice().sort(byCreated), xs = new Map((v.excel || []).map(function(p){ return [p[0], p[1]]; }));
    return [v.numero, v.adresse, v.commune, v.nom, fmtTel(fixTel(v.tel)), v.mail || '', ficheDomicile(v), stLabel(v.statut), fmtDate(v.dateVisite), l.length,
      l.filter(function(a){ return a.reseau === 'EU'; }).length, l.filter(function(a){ return a.reseau === 'EP'; }).length,
      v.aucuneAnomalie ? 'oui' : '', issuesOf(v, l).map(function(x){ return x.msg; }).join(' | '), v.obsEP || '', v.obsEU || '', v.observations || ''].concat(extra.map(function(h){ return xs.has(h) ? xs.get(h) : ''; }));
  });
  var ws1 = XLSX.utils.aoa_to_sheet([vHead].concat(vRows));
  ws1['!cols'] = [12, 34, 16, 22, 14, 26, 34, 12, 12, 10, 8, 8, 12, 40, 30, 30, 30].concat(extra.map(function(){ return 16; })).map(function(w){ return {wch: w}; });
  var aHead = ['N° dossier', 'Adresse de la visite', 'Anomalie', 'Réseau', 'Catégorie', 'Localisation', 'Anomalie observée', 'Préconisation de travaux', 'Photos', 'Fichiers photos', 'Validée', 'Saisie le'];
  var aRows = [];
  vs.forEach(function(v){
    (by.get(v.id) || []).slice().sort(byCreated).forEach(function(a, i){
      aRows.push([v.numero, v.adresse, 'A' + (i + 1), a.reseau || '', catLabel(anomCat(a)), a.localisation || '', a.observation || '', a.preconisation || '', (a.photos || []).length,
        (a.photos || []).map(function(pid, j){ return photoFileName(v, i, j, 'image/jpeg'); }).join(', '), a.brouillon ? 'non' : 'oui', fmtDT(a.createdAt)]);
    });
  });
  var ws2 = XLSX.utils.aoa_to_sheet([aHead].concat(aRows));
  ws2['!cols'] = [12, 34, 9, 8, 20, 24, 50, 50, 8, 30, 8, 18].map(function(w){ return {wch: w}; });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws1, 'Visites');
  XLSX.utils.book_append_sheet(wb, ws2, 'Anomalies');
  return XLSX.write(wb, {bookType: 'xlsx', type: 'array', compression: true});
}
/* CSV de toute l'étude : une ligne par anomalie, une ligne par dossier sans anomalie ; « ; » et UTF-8 pour Excel français */
function csvCell(x){ var s = String(x == null ? '' : x); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function etudeCsv(e, vs, as){
  var by = groupBy(as, 'visiteId'), extra = (e.source && e.source.headers) || [];
  var rows = [['N° dossier', 'Adresse de la visite', 'Commune', 'Propriétaire', 'Téléphone', 'Mail', 'Adresse du domicile', 'Statut', 'Date de visite', 'Aucune anomalie constatée', 'Points à compléter',
    'N° anomalie', 'Réseau', 'Catégorie', 'Anomalie observée', 'Préconisation de travaux', 'Localisation', 'Photos', 'Anomalie validée', 'Observation EP', 'Observation EU', 'Notes internes'].concat(extra.map(function(h){ return 'Tableau : ' + h; }))];
  vs.forEach(function(v){
    var l = (by.get(v.id) || []).slice().sort(byCreated), xs = new Map((v.excel || []).map(function(p){ return [p[0], p[1]]; }));
    var head = [v.numero, v.adresse, v.commune, v.nom, fmtTel(fixTel(v.tel)), v.mail || '', ficheDomicile(v), stLabel(v.statut), fmtDate(v.dateVisite), v.aucuneAnomalie ? 'oui' : '', issuesOf(v, l).map(function(x){ return x.msg; }).join(' | ')];
    var tail = [v.obsEP || '', v.obsEU || '', v.observations || ''].concat(extra.map(function(h){ return xs.has(h) ? xs.get(h) : ''; }));
    if (!l.length) rows.push(head.concat(['', '', '', '', '', '', '', '']).concat(tail));
    l.forEach(function(a, i){ rows.push(head.concat(['A' + (i + 1), a.reseau || '', catLabel(anomCat(a)), a.observation || '', a.preconisation || '', a.localisation || '', (a.photos || []).length, a.brouillon ? 'non' : 'oui']).concat(tail)); });
  });
  return '\ufeff' + rows.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n') + '\r\n';
}
async function exportEtude(){
  if (!libsOk()) return false;
  await flushSaves();
  var e = S.etude, vs = S.visites.slice(), as = S.anoms.slice(), busy = busyModal('Préparation de l\'export'), pdfOk = !!(window.jspdf && window.jspdf.jsPDF);
  try {
    var zip = new JSZip(), rootName = safeName('Obs & preco - ' + e.nom, 90), root = zip.folder(rootName);
    var by = groupBy(as, 'visiteId'), photoIndex = [], used = new Set(), done = 0;
    for (var vi = 0; vi < vs.length; vi++){
      var v = vs[vi], list = (by.get(v.id) || []).slice().sort(byCreated);
      done++;
      if (!list.length && v.statut === 'a_visiter' && !String(v.observations || '').trim()) continue;
      var base = safeName(v.numero + (v.adresse ? ' - ' + v.adresse : ''), 80), folder = base, k = 2;
      while (used.has(folder.toLowerCase())) folder = base + ' (' + (k++) + ')';
      used.add(folder.toLowerCase());
      var vf = root.folder(folder);
      for (var i = 0; i < list.length; i++){
        var ids = list[i].photos || [];
        for (var j = 0; j < ids.length; j++){
          var p = await DB.get('photos', ids[j]); if (!p) continue;
          var fname = photoFileName(v, i, j, p.type);
          vf.file(fname, bytes(p.data), {binary: true});
          photoIndex.push({id: p.id, anomalieId: list[i].id, visiteId: v.id, path: rootName + '/' + folder + '/' + fname, type: p.type, w: p.w, h: p.h, createdAt: p.createdAt});
        }
      }
      if (pdfOk){ var d = newPdf(); d.setProperties({title: 'Préco ' + v.numero, author: 'SAS VÉDÉ Environnement', creator: 'VÉDÉ Terrain'}); await fichePdfDoc(d, v, {}, true); vf.file(ficheFileName(v), d.output('arraybuffer'), {binary: true}); }
      busy.set('Dossiers préparés : ' + done + ' sur ' + vs.length, 0.5 * done / Math.max(1, vs.length));
    }
    root.file(safeName('Recapitulatif - ' + e.nom, 90) + '.xlsx', bytes(recapXlsx(e, vs, as)), {binary: true});
    root.file(safeName('Etude complete - ' + e.nom, 90) + '.csv', etudeCsv(e, vs, as), {compression: 'DEFLATE'});
    var biblio = await DB.all('biblio');
    root.file('_sauvegarde/vede-terrain-sauvegarde.json', JSON.stringify({format: 'vede-terrain', version: 1, app: VERSION, exportedAt: nowISO(), etude: e, visites: vs, anomalies: as, photos: photoIndex, biblio: biblio}), {compression: 'DEFLATE'});
    var blob = await zip.generateAsync({type: 'blob', mimeType: 'application/zip'}, function(m){ busy.set('Compression : ' + Math.round(m.percent) + ' %', 0.5 + m.percent / 200); });
    busy.close();
    var ok = await saveFile(blob, safeName('Obs & preco - ' + e.nom + ' - ' + todayStr(), 120) + '.zip');
    if (ok){ e.lastExportAt = nowISO(); if (e.updatedAt > e.lastExportAt) e.updatedAt = e.lastExportAt; await DB.put('etudes', e); render(); }
    return ok;
  } catch(err){ busy.close(); reportError(err, 'Export impossible'); return false; }
}

async function restoreZip(file){
  if (!libsOk()) return false;
  var busy = busyModal('Lecture de la sauvegarde');
  try {
    var zip = await JSZip.loadAsync(file);
    var entry = Object.keys(zip.files).map(function(k){ return zip.files[k]; }).find(function(f){ return !f.dir && /(^|\/)_sauvegarde\/vede-terrain-sauvegarde\.json$/.test(f.name); });
    if (!entry){ busy.close(); toast('Ce fichier n\'est pas un export VÉDÉ Terrain.', 4500); return false; }
    var data = JSON.parse(await entry.async('string'));
    busy.close();
    if (data.format !== 'vede-terrain' || !data.etude){ toast('Sauvegarde illisible.'); return false; }
    var exists = await DB.get('etudes', data.etude.id);
    if (exists){
      if (!(await confirmModal('Remplacer l\'étude ?', 'L\'étude « ' + data.etude.nom + ' » existe déjà sur cet appareil. Sa version actuelle sera remplacée par celle de la sauvegarde du ' + fmtDT(data.exportedAt) + '.', 'Remplacer', true))) return false;
      await deleteEtudeData(data.etude.id);
    }
    var busy2 = busyModal('Restauration en cours'), photos = data.photos || [], restored = new Set(), aIndex = new Map((data.anomalies || []).map(function(a){ return [a.id, a]; }));
    for (var i = 0; i < photos.length; i++){
      var p = photos[i], f = zip.file(p.path); if (!f) continue;
      var ab = await f.async('arraybuffer'), an = aIndex.get(p.anomalieId);
      await DB.put('photos', {id: p.id, anomalieId: p.anomalieId, visiteId: p.visiteId || (an && an.visiteId), etudeId: data.etude.id, data: ab, type: p.type || 'image/jpeg', w: p.w || 0, h: p.h || 0, createdAt: p.createdAt || nowISO()});
      restored.add(p.id);
      busy2.set('Photos restaurées : ' + (i + 1) + ' sur ' + photos.length, (i + 1) / photos.length);
    }
    (data.anomalies || []).forEach(function(a){ a.photos = (a.photos || []).filter(function(id){ return restored.has(id); }); });
    await DB.putMany('visites', data.visites || []);
    await DB.putMany('anomalies', data.anomalies || []);
    await DB.put('etudes', data.etude);
    var bib = await DB.all('biblio'), have = new Set(bib.map(function(b){ return b.id; })), add = (data.biblio || []).filter(function(b){ return !have.has(b.id); });
    if (add.length) await DB.putMany('biblio', add);
    busy2.close();
    S.etude = null; requestPersist();
    toast('Étude restaurée : ' + plural((data.visites || []).length, 'dossier', 'dossiers'), 3500);
    go('#/e/' + data.etude.id);
    return true;
  } catch(err){ busy.close(); reportError(err, 'Restauration impossible'); return false; }
}

function openModal(o){
  return new Promise(function(resolve){
    var actions = o.actions || [], w = document.createElement('div'); w.className = 'modal-back';
    w.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(o.title || '') + '">' + (o.title ? '<h2 class="m-title">' + esc(o.title) + '</h2>' : '')
      + '<div class="m-body">' + (o.html || '') + '</div>' + (actions.length ? '<div class="m-foot">' + actions.map(function(a, i){ return '<button type="button" class="btn ' + (a.cls || '') + '" data-mi="' + i + '">' + esc(a.label) + '</button>'; }).join('') + '</div>' : '') + '</div>';
    $('#modal-root').appendChild(w);
    var done = false;
    function close(val){ if (done) return; done = true; w.remove(); document.removeEventListener('keydown', onKey); resolve(val); }
    function onKey(ev){ if (ev.key === 'Escape') close(undefined); }
    document.addEventListener('keydown', onKey);
    w.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-mi]');
      if (b){ var a = actions[+b.dataset.mi]; if (a.collect){ var r = a.collect(w); if (r === false) return; close(r); } else close('value' in a ? a.value : a.label); return; }
      if (ev.target === w) close(undefined);
    });
    if (o.onMount) o.onMount(w, close);
    if (!o.noAutofocus){ var f = w.querySelector('[data-autofocus]') || w.querySelector('.m-foot .btn.primary, .m-foot .btn.danger-solid'); if (f) setTimeout(function(){ f.focus(); }, 30); }
  });
}
function confirmModal(title, text, ok, danger){ return openModal({title: title, html: '<p>' + esc(text) + '</p>', actions: [{label: 'Annuler', value: false}, {label: ok || 'Confirmer', value: true, cls: danger ? 'danger-solid' : 'primary'}]}); }

      + '<label class="field"><span class="lbl">Catégorie</span><select id="m-cat"><option value="">Automatique, d\'après le libellé</option>' + CATS.map(function(c){ return '<option value="' + c[0] + '"' + (c[0] === cat ? ' selected' : '') + '>' + esc(c[1]) + '</option>'; }).join('') + '</select></label>'
      + '<label class="field"><span class="lbl">Anomalie observée</span><textarea id="m-obs" rows="3">' + esc(item.observation || '') + '</textarea></label>'
      + '<label class="field"><span class="lbl">Préconisation de travaux</span><textarea id="m-pre" rows="3">' + esc(item.preconisation || '') + '</textarea></label>',
    actions: [{label: 'Annuler', value: null}, {label: 'Enregistrer', cls: 'primary', collect: function(w){
      var o = w.querySelector('#m-obs').value.trim(); if (!o){ toast('Décrivez l\'anomalie.'); return false; }
      var c = w.querySelector('#m-cat').value;
      return {reseau: net, observation: o, preconisation: w.querySelector('#m-pre').value.trim(), categorie: c || autoCat(net, o)};
    }}],
    onMount: function(w){ w.addEventListener('click', function(ev){ var bt = ev.target.closest('[data-m="net"]'); if (!bt) return; net = bt.dataset.v; $$('[data-m="net"]', w).forEach(function(x){ x.setAttribute('aria-pressed', String(x.dataset.v === net)); }); }); }});
  if (!res) return;
  var t = nowISO();
  await DB.put('biblio', Object.assign({}, item, res, {id: item.id || uid(), exemple: false, createdAt: item.createdAt || t, updatedAt: t}));
  render();
}
async function seedBiblio(){
  try {
    var meta = await DB.get('meta', 'seedVersion'), ver = meta ? meta.v : 0;
    if (ver >= 3) return;
    var t = nowISO(), all = await DB.all('biblio');
    var drop = all.filter(function(b){ return b.exemple || (b.source === 'modele' && b.updatedAt === b.createdAt); });
    if (drop.length) await DB.delMany('biblio', drop.map(function(b){ return b.id; }));
    var keep = all.filter(function(b){ return drop.indexOf(b) < 0; });
    keep.forEach(function(b){ if (!b.categorie) b.categorie = autoCat(b.reseau, b.observation); });
    if (keep.length) await DB.putMany('biblio', keep);
    var key = function(r, o, p){ return r + '|' + norm(o).trim() + '|' + norm(p).trim(); };
    var have = new Set(keep.map(function(b){ return key(b.reseau, b.observation, b.preconisation); }));
    var add = SEEDS.filter(function(s){ return !have.has(key(s[0], s[1], s[2])); })
      .map(function(s){ return {id: uid(), reseau: s[0], observation: s[1], preconisation: s[2], categorie: autoCat(s[0], s[1]), usage: 0, exemple: false, source: 'modele', createdAt: t, updatedAt: t}; });
    if (add.length) await DB.putMany('biblio', add);
    await DB.put('meta', {k: 'seedVersion', v: 3});
    await DB.put('meta', {k: 'seeded', v: true});
  } catch(e){ if (window.console) console.warn(e); }
}

/* ---------- Actions ---------- */
var ACTIONS = {
  back: function(el){ var t = el.dataset.href; if (S.lastHash === t && history.length > 1) history.back(); else go(t); },
  nav: function(el){ go(el.dataset.href); },
  'pick-excel': function(){ $('#in-excel').click(); },
  'pick-zip': function(){ $('#in-zip').click(); },
  'create-etude': function(){ return createEtude(); },
  'apply-update': function(){ return applyUpdate(); },
  'etude-menu': function(){ return etudeMenu(); },
  filter: function(el){ S.filter = el.dataset.v; refreshListPane(); },
  statut: async function(el){
    var v = curVisit(); if (!v) return;
    v.statut = el.dataset.v; if (v.statut === 'visitee' && !v.dateVisite) v.dateVisite = todayStr();
    v.updatedAt = nowISO(); saveLater('visites', v); touchEtude(); await flushSaves(); render();
  },
  'new-anom': async function(el){
    var v = curVisit(); if (!v) return;
    var t = nowISO(), a = {id: uid(), etudeId: v.etudeId, visiteId: v.id, reseau: el.dataset.net === 'EP' ? 'EP' : 'EU', observation: '', preconisation: '', localisation: '', photos: [], photoNonRequise: false, brouillon: true, createdAt: t, updatedAt: t};
    if (v.aucuneAnomalie){ v.aucuneAnomalie = false; v.updatedAt = t; saveLater('visites', v); }
    await DB.put('anomalies', a); S.anoms.push(a); touchEtude();
    S.autoPick = a.id;
    go('#/e/' + v.etudeId + '/v/' + v.id + '/a/' + a.id);
    return a.id;
  },
  'set-net': function(el){
    var a = curAnom(); if (!a) return;
    a.reseau = el.dataset.v === 'EP' ? 'EP' : 'EU'; a.updatedAt = nowISO(); saveLater('anomalies', a); touchEtude();
    $$('[data-act="set-net"]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === a.reseau)); });
  },
  'pick-type': function(){ return pickType(); },
  'photo-cam': function(){ flushSaves(); $('#in-camera').click(); },
  'photo-gal': function(){ flushSaves(); $('#in-gallery').click(); },
  'view-photo': function(el){ return viewPhoto(el.dataset.pid); },
  'validate-anom': async function(){
    var a = curAnom(), v = curVisit(); if (!a || !v) return;
    if (a.reseau !== 'EU' && a.reseau !== 'EP'){ toast('Précisez le réseau : EU ou EP.'); return; }
    if (!lignesSansPuce(a.observation).length){ toast('Décrivez l\'anomalie constatée.'); var o = $('[data-af="observation"]'); if (o) o.focus(); return; }
    a.brouillon = false; a.updatedAt = nowISO(); await DB.put('anomalies', a);
    var msg = 'Anomalie validée', st = $('#save-type');
    if (st && st.checked && (await addToBiblio(a))) msg += ', ajoutée aux anomalies types';
    if (v.statut === 'a_visiter'){ v.statut = 'visitee'; if (!v.dateVisite) v.dateVisite = todayStr(); v.updatedAt = nowISO(); await DB.put('visites', v); msg += ', dossier passé en « Visitée »'; }
    touchEtude(); toast(msg, 3500);
    go('#/e/' + v.etudeId + '/v/' + v.id);
  },
  'del-anom': async function(){
    var a = curAnom(), v = curVisit(); if (!a || !v) return;
    var n = anomsOf(v.id).indexOf(a) + 1, np = (a.photos || []).length;
    if (!(await confirmModal('Supprimer l\'anomalie A' + n + ' ?', np ? 'L\'anomalie et ' + (np > 1 ? 'ses ' + np + ' photos' : 'sa photo') + ' seront effacées.' : 'L\'anomalie sera effacée.', 'Supprimer', true))) return;
    pending.delete('anomalies:' + a.id);
    await DB.delMany('photos', a.photos || []); await DB.del('anomalies', a.id);
    S.anoms = S.anoms.filter(function(x){ return x.id !== a.id; }); touchEtude(); toast('Anomalie supprimée');
    go('#/e/' + v.etudeId + '/v/' + v.id);
  },
  'dl-fiche': function(el){ return downloadFichePdf(el.dataset.vid); },
  'date-today': function(){ var v = curVisit(); if (!v) return; v.dateVisite = todayStr(); v.updatedAt = nowISO(); saveLater('visites', v); touchEtude(); var inp = $('[data-vf="dateVisite"]'); if (inp) inp.value = v.dateVisite; var df = $('#date-fr'); if (df){ df.textContent = fmtDateLong(v.dateVisite); df.className = ''; } refreshIssuesUI(); },
  'biblio-new': function(el){ return biblioForm({reseau: el.dataset.net}); },
  'biblio-edit': async function(el){ var it = await DB.get('biblio', el.dataset.id); if (it) return biblioForm(it); },
  'biblio-del': async function(el){ var it = await DB.get('biblio', el.dataset.id); if (!it) return; if (await confirmModal('Supprimer cette anomalie type ?', it.observation, 'Supprimer', true)){ await DB.del('biblio', it.id); render(); } }
};

/* ---------- Événements ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el || el.closest('#modal-root')) return;
  var fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  Promise.resolve().then(function(){ return fn(el, ev); }).catch(function(err){ reportError(err); });
});
document.addEventListener('input', function(ev){
  var t = ev.target; if (!t || !t.closest || t.closest('#modal-root')) return;
  if (t.type === 'checkbox' || t.type === 'date' || t.type === 'file') return;
  if (t.matches('[data-vf]')) onVisitField(t);
  else if (t.matches('[data-af]')) onAnomField(t);
  else if (t.id === 'q'){ S.search = t.value; var ul = $('#vlist'); if (ul) ul.innerHTML = listRowsHtml(); }
  else if (t.id === 'imp-name' && S.imp) S.imp.name = t.value;
});
document.addEventListener('change', function(ev){
  var t = ev.target; if (!t || !t.closest || t.closest('#modal-root')) return;
  if (t.id === 'in-excel') return onExcelFile(t);
  if (t.id === 'in-zip') return onZipFile(t);
  if (t.id === 'in-camera' || t.id === 'in-gallery') return onPhotoFiles(t);
  if (t.matches('[data-imp]')) return onImpChange(t);
  if (t.type === 'checkbox' || t.type === 'date'){ if (t.matches('[data-vf]')) onVisitField(t); else if (t.matches('[data-af]')) onAnomField(t); }
});
window.addEventListener('error', function(e){ if (e && e.message && !/ResizeObserver|Script error/.test(e.message)) toast('Erreur : ' + e.message, 4500); });
window.addEventListener('unhandledrejection', function(e){ var r = e.reason; toast('Erreur : ' + (r && r.message ? r.message : r), 4500); });

/* ---------- Démarrage ---------- */
async function init(){
  try { S.framed = window.self !== window.top; } catch(e){ S.framed = true; }
  var canUse = !window.VEDE_PWA && window.claude && typeof window.claude.use === 'function';
  S.dlPromise = canUse ? Promise.race([Promise.resolve(window.claude.use('downloads')).catch(function(){ return null; }), new Promise(function(r){ setTimeout(function(){ r(null); }, 11000); })]) : Promise.resolve(null);
  try { await DB.open(); }
  catch(e){ $('#app').innerHTML = '<div class="fatal"><h1 class="h1">Stockage indisponible</h1><p>Ce navigateur bloque l\'enregistrement local (' + esc(e && e.message) + '). Ouvrez l\'application dans Chrome ou Safari, hors navigation privée.</p></div>'; return; }
  var st = document.createElement('style'); st.textContent = FICHE_CSS; document.head.appendChild(st);

    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){ var nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', function(){ if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Nouvelle version installée : elle sera active à la prochaine ouverture.', 5000); }); });
    }).catch(function(err){ if (window.console) console.warn('SW', err); });

}
window.__VT = {S: S, DB: DB, startImport: startImport, computeImport: computeImport, guessMap: guessMap, issuesOf: issuesOf, createEtude: createEtude, applyUpdate: applyUpdate, exportEtude: exportEtude, restoreZip: restoreZip, addPhotos: addPhotos, ACTIONS: ACTIONS, render: render, flushSaves: flushSaves, recapXlsx: recapXlsx, deleteEtudeData: deleteEtudeData, etudeCsv: etudeCsv, fichePdfBlob: fichePdfBlob, ficheFileName: ficheFileName, ficheHeader: ficheHeader, exportFichesPdf: exportFichesPdf, exportCsv: exportCsv, fmtDateLong: fmtDateLong, autoCat: autoCat, ready: null};
window.__VT.ready = init();
