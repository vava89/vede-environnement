# Publie l'application sur GitHub Pages à chaque mise à jour de main.
# Réglage du dépôt : Settings > Pages > Build and deployment > Source : « GitHub Actions ».
# Publication manuelle possible : onglet Actions > « Mise en ligne » > Run workflow.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mise-en-ligne:
    name: Publication sur GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
